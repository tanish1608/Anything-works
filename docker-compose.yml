name: sitemesh
# Local stack: docker compose up --build --wait → web on 8080, API on 8011.
# Keep the inherited project name so existing named database/storage volumes are reused.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sitemesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitemesh-local}
      POSTGRES_DB: sitemesh
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitemesh"]
      interval: 3s
      retries: 20

  api:
    build:
      context: ./backend
      secrets: [extra_ca]
    env_file:
      - { path: .env, required: false }
      - { path: ./backend/.env, required: false }
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://sitemesh:${POSTGRES_PASSWORD:-sitemesh-local}@db:5432/sitemesh
      STORAGE_DIR: /data/storage
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-8080}","http://127.0.0.1:${WEB_PORT:-8080}"]'
    volumes:
      - storage:/data/storage
      - ./samples:/samples:ro  # demo seed data (python -m app.seed)
    ports: ["127.0.0.1:${API_PORT:-8011}:8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,sys,urllib.request; s=json.load(urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)); sys.exit(0 if '/api/agent/public-chat' in s['paths'] else 1)"
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ./web
      secrets: [extra_ca]
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  storage:

secrets:
  # Only needed behind a TLS-intercepting proxy; point EXTRA_CA_FILE at its CA bundle.
  extra_ca:
    file: ${EXTRA_CA_FILE:-./.no-extra-ca}
