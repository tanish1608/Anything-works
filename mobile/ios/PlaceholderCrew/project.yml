name: PlaceholderCrew
options:
  bundleIdPrefix: ai.placeholder
  deploymentTarget:
    iOS: "17.0"
packages:
  CrewCore:
    path: ../CrewCore
targets:
  PlaceholderCrew:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: CrewCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tanishvardhineni.placeholdercrew
        DEVELOPMENT_TEAM: 4ZRRP5T5VP
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Placeholder Crew
        INFOPLIST_KEY_NSCameraUsageDescription: Take photos of your work and measure with AR.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Attach a GPS fix to your daily update.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose photos of your work to attach.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Speak your daily update instead of typing.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn your spoken update into text.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
